<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf6e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하이츄">
<title>하이츄 — 하이의 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ───────────────────────── 홈 ───────────────────────── -->
<section id="screen-home" class="screen is-active">
  <header class="home-head">
    <div class="home-title">
      <h1>무엇을 하고 놀까?</h1>
      <span class="home-sub">오늘도 재미있게 놀아 보자!</span>
    </div>
    <!-- 아이콘은 js/main.js 가 인라인 SVG 로 채운다 (이모지를 쓰지 않는다) -->
    <button id="btn-settings" class="home-btn" type="button" aria-label="설정"></button>
    <button id="btn-sound" class="home-btn" type="button" aria-label="소리 켜기/끄기"></button>
    <button id="btn-gallery" class="home-btn is-pill" type="button"></button>
  </header>

  <div id="activity-groups" class="groups"></div>

  <footer class="home-foot">
    <span id="install-hint" class="hint"></span>
    <span id="audio-state" class="hint"></span>
  </footer>
</section>

<!-- ───────────────────────── 색칠하기 ───────────────────────── -->
<section id="screen-coloring" class="screen">

  <!-- 위쪽 도구 트레이 -->
  <div class="tray tray-top">
    <div class="tools" id="tool-strip"></div>

    <div class="tray-right">
      <div class="sizes" id="size-strip"></div>
      <button id="btn-color" class="swatch-btn" type="button" aria-label="색 고르기">
        <span class="swatch-dot" id="current-swatch"></span>
      </button>
    </div>
  </div>

  <!-- 그림판 -->
  <div class="stage" id="stage">
    <div class="paper" id="paper">
      <canvas id="c-paint"></canvas>
      <canvas id="c-stroke"></canvas>
      <canvas id="c-lines"></canvas>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <!-- 아래쪽 버튼 -->
  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-home" type="button"></button>
    <button data-icon="undo" class="rbtn" id="btn-undo" type="button" disabled></button>
    <button data-icon="redo" class="rbtn" id="btn-redo" type="button" disabled></button>
    <div class="spacer"></div>
    <button data-icon="clear" class="rbtn hold" id="btn-clear" type="button"><i class="hold-fill"></i></button>
    <button data-icon="save" class="rbtn" id="btn-save" type="button"></button>
    <button class="rbtn wide" id="btn-next" data-icon="gallery" type="button"><b>다른 그림</b></button>
    <div class="palm" aria-hidden="true"></div>
  </div>

  <!-- 색 고르기 팝오버 -->
  <div class="popover" id="popover-color" hidden>
    <div class="pop-inner">
      <div class="pop-row" id="recent-colors"></div>
      <div class="pop-swatches" id="palette-grid"></div>
      <button class="pop-close" id="btn-color-close" type="button">✕</button>
    </div>
  </div>

  <!-- 그림 고르기 시트 -->
  <div class="sheet" id="sheet-pages" hidden>
    <div class="sheet-inner">
      <h2>어떤 그림에 색칠할까?</h2>
      <div class="page-grid" id="page-grid"></div>
      <button class="pop-close" id="btn-pages-close" type="button">✕</button>
    </div>
  </div>
</section>

<!-- ─── 따라 그리기류 공용 화면 ───────────────────────────────
     선 긋기 · 한글 · 숫자 · 미로 · 점 잇기가 이 화면 하나를 나눠 쓴다.
     js/trace/index.js 의 러너가 코스만 갈아 끼운다. -->
<section id="screen-trace" class="screen">

  <!-- 단계 고르기 -->
  <div class="tray tray-top">
    <div class="tools" id="trace-strip"></div>
  </div>

  <!-- 연습판 -->
  <div class="stage" id="trace-stage">
    <div class="paper" id="trace-paper">
      <canvas id="t-ink"></canvas>
      <canvas id="t-guide"></canvas>
      <canvas id="t-fill"></canvas>
      <canvas id="t-fx"></canvas>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-trace-home" type="button"></button>
    <button data-icon="undo" class="rbtn" id="btn-trace-again" type="button"></button>
    <button data-icon="say" class="rbtn" id="btn-trace-say" type="button" hidden></button>
    <div class="spacer"></div>
    <button data-icon="prev" class="rbtn" id="btn-trace-prev" type="button"></button>
    <span class="lvl-name" id="trace-name"></span>
    <button data-icon="next" class="rbtn" id="btn-trace-next" type="button"></button>
    <div class="palm" aria-hidden="true"></div>
  </div>
</section>

<!-- ───────────────────────── 조각 퍼즐 ───────────────────────── -->
<section id="screen-puzzle" class="screen">

  <div class="tray tray-top">
    <div class="tools" id="puzzle-strip"></div>
  </div>

  <div class="stage" id="puzzle-stage">
    <div class="paper" id="puzzle-paper">
      <canvas id="p-board"></canvas>
      <canvas id="p-loose"></canvas>
      <canvas id="p-drag"></canvas>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-puzzle-home" type="button"></button>
    <button data-icon="undo" class="rbtn" id="btn-puzzle-again" type="button"></button>
    <div class="spacer"></div>
    <button data-icon="prev" class="rbtn" id="btn-puzzle-prev" type="button"></button>
    <span class="lvl-name" id="puzzle-name"></span>
    <button data-icon="next" class="rbtn" id="btn-puzzle-next" type="button"></button>
    <div class="palm" aria-hidden="true"></div>
  </div>
</section>

<!-- ───────────────────────── 다른 그림 찾기 ───────────────────────── -->
<section id="screen-spot" class="screen">

  <div class="tray tray-top">
    <div class="tools" id="spot-strip"></div>
  </div>

  <div class="stage" id="spot-stage">
    <div class="paper" id="spot-paper">
      <canvas id="s-board"></canvas>
      <canvas id="s-mark"></canvas>
      <canvas id="s-ink"></canvas>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-spot-home" type="button"></button>
    <button data-icon="undo" class="rbtn" id="btn-spot-again" type="button"></button>
    <div class="spacer"></div>
    <button data-icon="prev" class="rbtn" id="btn-spot-prev" type="button"></button>
    <span class="lvl-name" id="spot-name"></span>
    <button data-icon="next" class="rbtn" id="btn-spot-next" type="button"></button>
    <div class="palm" aria-hidden="true"></div>
  </div>
</section>

<!-- ───────────────────────── 세어보기 ───────────────────────── -->
<section id="screen-count" class="screen">

  <div class="tray tray-top">
    <div class="tools" id="count-strip"></div>
  </div>

  <div class="stage" id="count-stage">
    <div class="paper" id="count-paper">
      <canvas id="cn-board"></canvas>
      <canvas id="cn-mark"></canvas>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-count-home" type="button"></button>
    <button data-icon="undo" class="rbtn" id="btn-count-again" type="button"></button>
    <div class="spacer"></div>
    <button data-icon="prev" class="rbtn" id="btn-count-prev" type="button"></button>
    <span class="lvl-name" id="count-name"></span>
    <button data-icon="next" class="rbtn" id="btn-count-next" type="button"></button>
    <div class="palm" aria-hidden="true"></div>
  </div>
</section>

<!-- ───────────────────────── 갤러리 ───────────────────────── -->
<!-- ───────────────────────── 설정 (손잡이) ───────────────────────── -->
<div class="overlay" id="sheet-settings" hidden>
  <div class="panel">
    <div class="panel-head">
      <h2>설정</h2>
      <button class="panel-close" id="btn-settings-close" type="button" aria-label="닫기">✕</button>
    </div>
    <p class="panel-q">어느 손으로 그려요?</p>
    <div class="hand-pick">
      <button class="hand-card" id="hand-left" type="button" data-hand="left"></button>
      <button class="hand-card" id="hand-right" type="button" data-hand="right"></button>
    </div>
    <p class="panel-note">그리는 화면에서는 손 반대쪽에 버튼을 모아, 손바닥이 닿아도 눌리지 않아요.</p>

    <p class="panel-q">영상 보기</p>
    <button class="opt-card" id="opt-video" type="button" aria-pressed="false">
      <span class="opt-text">
        <span class="nm">홈에 보이기</span>
        <span class="desc">꺼 두면 홈에서 사라져요</span>
      </span>
      <span class="switch" aria-hidden="true"><i></i></span>
    </button>
  </div>
</div>

<!-- ───────────────────────── 영상 보기 ───────────────────────── -->
<section id="screen-video" class="screen">

  <div class="tray tray-top">
    <div class="tools" id="video-strip"></div>
  </div>

  <div class="stage" id="video-stage">
    <div class="paper" id="video-paper">
      <video id="video-player" playsinline controls preload="metadata"></video>
      <img id="video-cover" alt="" hidden>
      <div class="video-empty" id="video-empty" hidden></div>
      <div class="paper-rings" aria-hidden="true"></div>
    </div>
  </div>

  <div class="tray tray-bottom">
    <button data-icon="home" class="rbtn" id="btn-video-home" type="button"></button>
    <div class="spacer"></div>
    <button data-icon="prev" class="rbtn" id="btn-video-prev" type="button"
            aria-label="이전 시리즈"></button>
    <span class="lvl-name" id="video-name"></span>
    <button data-icon="next" class="rbtn" id="btn-video-next" type="button"
            aria-label="다음 시리즈"></button>
    <div class="palm" aria-hidden="true"></div>
  </div>
</section>

<section id="screen-gallery" class="screen">
  <header class="home-head">
    <button class="chip" id="btn-gallery-back" type="button">← 돌아가기</button>
    <h1>내 그림</h1>
  </header>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
