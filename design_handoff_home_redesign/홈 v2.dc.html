<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;height:100%}
a{color:#3a2f22}a:hover{color:#ff8a3d}
</style>
</helmet>
<div data-screen-label="홈 v2 (1a)" style="position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%, #ffe3b0 0%, #fdf1d6 60%);color:#3a2f22;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;display:flex;flex-direction:column;user-select:none">
  <header style="display:flex;align-items:center;gap:14px;padding:26px 32px 8px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <h1 style="font-size:34px;margin:0;font-weight:800;letter-spacing:-0.8px;white-space:nowrap">무엇을 하고 놀까?</h1>
      <span style="font-size:15px;font-weight:700;opacity:0.5">오늘도 재미있게 놀아 보자!</span>
    </div>
    <button aria-label="소리 켜기/끄기" style="margin-left:auto;background:#fff;border:0;border-radius:999px;width:56px;height:56px;box-shadow:0 4px 14px rgba(120,84,30,0.16);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg viewBox="0 0 48 48" width="26" height="26" fill="none" stroke="#3a2f22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19v10h7l9 8V11l-9 8H8z"></path><path d="M30 18c3 3 3 9 0 12"></path><path d="M35 14c5 5 5 15 0 20"></path></svg>
    </button>
    <button style="background:#fff;border:0;border-radius:999px;padding:0 22px;height:56px;font-size:18px;font-weight:800;box-shadow:0 4px 14px rgba(120,84,30,0.16);cursor:pointer;font-family:inherit;color:#3a2f22;display:flex;align-items:center;gap:10px;white-space:nowrap;flex-shrink:0">
      <svg viewBox="0 0 48 48" width="24" height="24" fill="none" stroke="#3a2f22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="38" height="30" rx="6"></rect><circle cx="16" cy="19" r="3.5"></circle><path d="M9 35l9-9 8 8 7-8 10 11"></path></svg>
      내 그림
    </button>
  </header>
  <div style="flex:1;overflow-y:auto;padding:10px 32px 28px;display:flex;flex-direction:column;gap:18px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:10px;height:10px;border-radius:50%;background:{{ g.dot }}"></span>
          <span style="font-size:15px;font-weight:800;opacity:0.55;letter-spacing:-0.3px;white-space:nowrap;flex-shrink:0">{{ g.title }}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px">
          <sc-for list="{{ g.items }}" as="c" hint-placeholder-count="3">
            <button style="background:#fff;border:0;border-radius:22px;box-shadow:0 4px 14px rgba(120,84,30,0.14);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;color:#3a2f22;position:relative;overflow:hidden;opacity:{{ c.op }};transition:transform .12s ease" style-active="transform:scale(0.96)">
              <span style="width:74px;height:74px;border-radius:22px;background:{{ g.tint }};display:flex;align-items:center;justify-content:center"><i style="width:46px;height:46px;display:block;background-image:url('{{ c.icon }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></span>
              <span style="font-size:18px;font-weight:800">{{ c.name }}</span>
              <span style="font-size:12px;opacity:0.55;font-weight:700">{{ c.desc }}</span>
              <sc-if value="{{ c.locked }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:11px;font-weight:800;background:#efe3cb;border-radius:999px;padding:3px 10px">곧 나와요</span>
              </sc-if>
              <i style="position:absolute;left:0;right:0;bottom:0;height:5px;background:{{ g.dot }};opacity:0.55"></i>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <footer style="padding:0 32px 16px;min-height:26px">
    <span style="font-size:13px;opacity:0.55;font-weight:600">공유 버튼 → "홈 화면에 추가" 하면 전체 화면 앱처럼 쓸 수 있어요</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showLocked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;콘텐츠&quot;}}">
class Component extends DCLogic {
  icon(inner, color) {
    return 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`);
  }
  glyph(txt, color) {
    return this.icon(
      `<text x="18" y="30" font-size="24" font-weight="800" text-anchor="middle" fill="${color}" stroke="none" font-family="sans-serif">${txt}</text>` +
      `<path d="M30 38l9-9 4 4-9 9-5 1z"/><path d="M8 41h14" stroke-dasharray="4 4"/>`, color);
  }
  renderVals() {
    const showLocked = this.props.showLocked ?? true;
    const I = (inner, c) => this.icon(inner, c);
    const O = '#e8762a', G = '#4da55c', B = '#4d84c4', N = '#a08b5f';
    const groups = [
      { title: '창작', dot: '#ff8a3d', tint: '#fff0e0', items: [
        { icon: I('<path d="M37 9c2 2 3 5 1 7L23 31l-6-6L32 10c2-2 3-3 5-1z"/><path d="M17 26c-3 1-5 3-6 6-1 3-2 4-4 5 4 2 9 1 12-2 2-2 2-5 1-7z"/>', O), name: '색칠하기', desc: '펜으로 자유롭게', op: 1 },
        { icon: I('<rect x="6" y="15" width="36" height="25" rx="5"/><circle cx="24" cy="27" r="7"/><path d="M17 15l3-5h8l3 5"/>', O), name: '내 사진 색칠', desc: '내 사진이 밑그림으로', op: 1 } ] },
      { title: '쓰기 준비', dot: '#7fd18a', tint: '#e9f7ea', items: [
        { icon: I('<path d="M6 32c6-12 12 10 18-2s6-8 18-8" stroke-dasharray="6 5"/>', G), name: '따라 그리기', desc: '점선 따라 쓱쓱', op: 1 },
        { icon: this.glyph('가', G), name: '한글 쓰기', desc: 'ㄱ ㄴ ㄷ 획순', op: 1 },
        { icon: I('<rect x="6" y="13" width="36" height="23" rx="6"/><circle cx="16" cy="24" r="4"/><path d="M25 20h11M25 28h7"/>', G), name: '이름 쓰기', desc: '우리 가족 이름', op: 1 },
        { icon: this.glyph('12', G), name: '숫자 쓰기', desc: '1부터 100까지', op: 1 },
        { icon: this.glyph('Ab', G), name: '영어 쓰기', desc: 'A B C 획순', op: 1 } ] },
      { title: '생각 놀이', dot: '#7ab8f2', tint: '#e8f1fc', items: [
        { icon: I('<path d="M24 25c0-3 5-3 5 0 0 4-10 4-10 0 0-8 15-8 15 0 0 10-20 10-20 0 0-13 25-13 25 0"/>', B), name: '미로 찾기', desc: '길을 그어 탈출', op: 1 },
        { icon: I('<circle cx="10" cy="36" r="3.5"/><circle cx="24" cy="12" r="3.5"/><circle cx="38" cy="32" r="3.5"/><path d="M12 32l10-16m4 1l10 12" stroke-dasharray="4 4"/>', B), name: '점 잇기', desc: '이으면 그림이!', op: 1 },
        { icon: I('<path d="M10 15h9a5 5 0 1 1 10 0h9v8a5 5 0 1 0 0 10v8h-9a5 5 0 1 0-10 0h-9v-8a5 5 0 1 1 0-10z"/>', B), name: '조각 퍼즐', desc: '맞추면 그림 완성!', op: 1 },
        { icon: I('<circle cx="14" cy="31" r="7"/><circle cx="32" cy="31" r="7"/><path d="M14 24v-7m18 7v-7m-18 0c2-2 4-2 6 0m10 0c2-2 4-2 6 0"/>', B), name: '세어보기', desc: '몇 개일까?', op: 1 },
        { icon: I('<circle cx="20" cy="20" r="11"/><path d="M29 29l11 11"/>', B), name: '다른 그림 찾기', desc: '눈썰미 대결', op: 1 } ] }
    ];
    if (showLocked) groups.push({ title: '곧 나와요', dot: '#c9b88f', tint: '#f6efe2', items: [
      { icon: I('<rect x="8" y="8" width="13" height="13" rx="3"/><circle cx="35" cy="14" r="7"/><path d="M17 40l7-11 7 11z"/>', N), name: '모양 분류', desc: '끌어다 담기', op: 0.5, locked: true } ] });
    return { groups };
  }
}
</script>
</body>
</html>
