<x-dc>

<meta name="design_doc_mode" content="canvas">
<style>

</helmet>
<section style="display:flex;gap:48px;padding:40px;align-items:flex-start;flex-wrap:wrap;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;color:#3a2f22">

    <div data-screen-label="색칠하기 v2" style="width:1180px;height:820px;overflow:hidden;background:#fdf1d6;border-radius:24px;box-shadow:0 20px 50px rgba(90,64,30,0.18);display:flex;flex-direction:column;user-select:none">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e9dcc4;box-shadow:0 2px 10px rgba(120,84,30,0.10);z-index:5">
        <div style="display:flex;gap:6px;align-items:center">
          <sc-for list="{{ tools }}" as="t" hint-placeholder-count="10">
            <div style="width:58px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:{{ t.bg }};border:2px solid {{ t.border }}">
              <i style="width:30px;height:30px;background-image:url('{{ t.icon }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i>

          <svg viewBox="0 0 940 658" style="position:absolute;inset:0;width:100%;height:100%">

                <i style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;background-image:url('{{ ic.star }}');background-size:contain;background-repeat:no-repeat"></i>

            <circle cx="540" cy="190" r="34" fill="none" stroke="#3fb950" stroke-width="5"></circle>

          </svg>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-top:1px solid #e9dcc4;box-shadow:0 -2px 10px rgba(120,84,30,0.10)">
        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center"><i style="width:32px;height:32px;background-image:url('{{ ic.home }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>

        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center"><i style="width:32px;height:32px;background-image:url('{{ ic.say }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>
        <div style="width:2px;height:44px;border-radius:2px;background:#e9dcc4;margin:0 8px"></div>
        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center;opacity:0.3"><i style="width:26px;height:26px;background-image:url('{{ ic.prev }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>
        <span style="font-size:19px;font-weight:800;min-width:104px;text-align:center;letter-spacing:-0.5px">가</span>
        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center"><i style="width:26px;height:26px;background-image:url('{{ ic.next }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>
        <div style="flex:1"></div>
        <span style="font-size:12px;font-weight:700;opacity:0.35;padding-right:8px">오른손 쉼터</span>
      </div>
    </div>

      <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-top:1px solid #e9dcc4;box-shadow:0 -2px 10px rgba(120,84,30,0.10)">
        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center"><i style="width:32px;height:32px;background-image:url('{{ ic.home }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>
        <div style="width:68px;height:68px;border-radius:20px;background:#f6efe2;display:flex;align-items:center;justify-content:center"><i style="width:32px;height:32px;background-image:url('{{ ic.undo }}');background-size:contain;background-repeat:no-repeat;background-position:center"></i></div>

        <span style="font-size:19px;font-weight:800;min-width:104px;text-align:center;letter-spacing:-0.5px">아기 곰</span>

</section>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  icon(inner, color, sw) {
    return 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="${color}" stroke-width="${sw || 3.5}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`);
  }
  renderVals() {
    const INK = '#5a4b34';
    const I = (inner, c, sw) => this.icon(inner, c || INK, sw);
    const ic = {
      home: I('<path d="M8 22L24 8l16 14v16a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z"/><path d="M19 41V29h10v12"/>'),
      undo: I('<path d="M14 19h16a9 9 0 1 1 0 18h-7"/><path d="M20 11l-8 8 8 8"/>'),

    const R = (inner) => 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">${inner}</svg>`);
    const toolDefs = [
      ['크레용', R('<path d="M19 17h10v21a5 5 0 0 1-10 0z" fill="#ff5a5a"/><path d="M19 17l5-9 5 9z" fill="#e03131"/><rect x="19" y="26" width="10" height="6" fill="#ffd3d3"/>'), 1],

      ['마커', R('<rect x="18" y="14" width="12" height="22" rx="3" fill="#6b6b6b"/><path d="M20 14l2-8h4l2 8z" fill="#3f3f3f"/><path d="M20 36l4 6 4-6z" fill="#3f3f3f"/><rect x="18" y="22" width="12" height="6" fill="#9a9a9a"/>'), 0],
      ['무지개', R('<g fill="none" stroke-linecap="round"><path d="M9 37a15 15 0 0 1 30 0" stroke="#ff5a5a" stroke-width="5"/><path d="M15 37a9 9 0 0 1 18 0" stroke="#ffc94d" stroke-width="5"/><path d="M21 37a3 3 0 0 1 6 0" stroke="#4fd06b" stroke-width="5"/></g>'), 0],
      ['반짝이', R('<path d="M21 6l3.5 9.5L34 19l-9.5 3.5L21 32l-3.5-9.5L8 19l9.5-3.5z" fill="#ffd166"/><path d="M36 26l2 5.5 5.5 1.5L38 35l-2 5.5L34 35l-5.5-2 5.5-1.5z" fill="#ffe6a3"/>'), 0],
      ['꽃', R('<g fill="#ff8fc4"><circle cx="24" cy="12" r="7"/><circle cx="35.5" cy="20.5" r="7"/><circle cx="31" cy="34" r="7"/><circle cx="17" cy="34" r="7"/><circle cx="12.5" cy="20.5" r="7"/></g><circle cx="24" cy="24" r="6" fill="#ffd166"/>'), 0],
      ['물감통', R('<path d="M10 16h28l-3 24a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4z" fill="#46cfe0"/><ellipse cx="24" cy="16" rx="14" ry="5" fill="#2fb3c4"/><path d="M13 12a11 9 0 0 1 22 0" stroke="#2fb3c4" stroke-width="4" fill="none" stroke-linecap="round"/>'), 0],
      ['스티커', R('<path d="M24 6l5.5 11.2L42 19l-9 8.8 2 12.2L24 34.2 13 40l2-12.2L6 19l12.5-1.8z" fill="#ffd166" stroke="#f0b429" stroke-width="2" stroke-linejoin="round"/>'), 0],
      ['지우개', R('<rect x="8" y="17" width="32" height="17" rx="8.5" fill="#e8e14d"/><g fill="#cfc93a"><circle cx="16" cy="24" r="2"/><circle cx="26" cy="29" r="2"/><circle cx="33" cy="23" r="2"/><circle cx="21" cy="21" r="1.5"/></g>'), 0]
    ];
    const tools = toolDefs.map(([label, icon, on]) => ({
      label, icon,
      bg: on ? '#fff3df' : '#f6efe2',
      border: on ? '#ff8a3d' : 'transparent',
      lift: 'none',
      glow: 'none'
    }));
    const sizes = [12, 22, 34].map((d, i) => ({
      d, bg: i === 1 ? '#fff3df' : '#f6efe2', border: i === 1 ? '#ff8a3d' : 'transparent'
    }));
    const colorBtns = [
      { icon: ic.home, op: 1 }, { icon: ic.undo, op: 1 }, { icon: ic.redo, op: 0.3 }
    ];
    const G = '#4da55c';
    const hardColors = ['#7fd18a', '#7fd18a', '#ffc94d', '#ffc94d', '#ff8a6b'];
    const traceLevels = ['가', '나', '다', '라', '마'].map((glyph, i) => ({
      glyph, name: glyph, done: i < 2,
      hard: hardColors[i],
      bg: i === 0 ? '#e9f7ea' : '#f6efe2',
      border: i === 0 ? G : 'transparent'
    }));
    const B = '#4d84c4';
    const thumbs = ['linear-gradient(135deg,#bfe4ff,#8fc7f2)', 'linear-gradient(135deg,#cdeccb,#9fd6a3)', 'linear-gradient(135deg,#ffe0b8,#f7c286)', 'linear-gradient(135deg,#f3d9f5,#ddb2e2)', 'linear-gradient(135deg,#ffd6d6,#f2a6a6)'];
    const names = ['아기 곰', '바닷속', '공룡', '꽃밭', '자동차'];
    const puzzleLevels = names.map((name, i) => ({
      name, thumb: thumbs[i], done: i < 1,
      bg: i === 0 ? '#e8f1fc' : '#f6efe2',
      border: i === 0 ? B : 'transparent'
    }));
    return { ic, tools, sizes, colorBtns, traceLevels, puzzleLevels };
