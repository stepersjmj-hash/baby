<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3a2f22}a:hover{color:#ff8a3d}
</style>
</helmet>
<div data-screen-label="홈 (현재)" style="position:relative;width:1180px;height:820px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%, #ffe3b0 0%, #fdf1d6 60%);color:#3a2f22;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;display:flex;flex-direction:column;user-select:none">
  <header style="display:flex;align-items:center;gap:16px;padding:22px 28px 10px">
    <h1 style="font-size:30px;margin:0;font-weight:800;letter-spacing:-0.5px">무엇을 하고 놀까?</h1>
    <button style="margin-left:auto;background:#fff;border:0;border-radius:999px;padding:12px 16px;font-size:22px;line-height:1;font-weight:700;box-shadow:0 4px 14px rgba(120,84,30,0.16);min-height:52px;cursor:pointer">🔊</button>
    <button style="background:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(120,84,30,0.16);min-height:52px;cursor:pointer;font-family:inherit;color:inherit">🖼️ 내 그림</button>
  </header>
  <div style="flex:1;display:grid;gap:18px;padding:14px 28px 28px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:min-content;overflow-y:auto">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="12">
      <button style="background:{{ c.bg }};border:0;border-radius:26px;box-shadow:{{ c.shadow }};padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:168px;justify-content:center;opacity:{{ c.opacity }};cursor:pointer;font-family:inherit;color:inherit;transition:transform .12s ease" style-active="transform:scale(0.96)">
        <span style="font-size:56px;line-height:1">{{ c.emoji }}</span>
        <span style="font-size:19px;font-weight:800">{{ c.name }}</span>
        <span style="font-size:13px;opacity:0.6;font-weight:600">{{ c.desc }}</span>
        <sc-if value="{{ c.locked }}" hint-placeholder-val="{{ false }}">
          <span style="font-size:12px;font-weight:800;background:#efe3cb;border-radius:999px;padding:4px 12px">곧 나와요</span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <footer style="padding:0 28px 16px;min-height:26px">
    <span style="font-size:13px;opacity:0.55;font-weight:600">공유 버튼 → "홈 화면에 추가" 하면 전체 화면 앱처럼 쓸 수 있어요 · v34</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:860}}">
class Component extends DCLogic {
  renderVals() {
    const acts = [
      ['coloring','🎨','색칠하기','펜으로 자유롭게',1],
      ['trace','✏️','따라 그리기','점선 따라 쓱쓱',1],
      ['hangul','🇰🇷','한글 쓰기','ㄱ ㄴ ㄷ 획순',1],
      ['names','📛','이름 쓰기','우리 가족 이름',1],
      ['number','🔢','숫자 쓰기','1부터 100까지',1],
      ['english','🔤','영어 쓰기','A B C 획순',1],
      ['maze','🌀','미로 찾기','길을 그어 탈출',1],
      ['dots','🔗','점 잇기','이으면 그림이!',1],
      ['puzzle','🧩','조각 퍼즐','맞추면 그림 완성!',1],
      ['sort','🗂️','모양 분류','끌어다 담기',0],
      ['count','🍎','세어보기','몇 개일까?',1],
      ['spot','🔍','다른 그림 찾기','눈썰미 대결',1]
    ];
    return { cards: acts.map(([id,emoji,name,desc,ready]) => ({
      id, emoji, name, desc,
      locked: !ready,
      bg: ready ? '#ffffff' : '#fff8ec',
      shadow: ready ? '0 4px 14px rgba(120,84,30,0.16)' : 'none',
      opacity: ready ? 1 : 0.42
    })) };
  }
}
</script>
</body>
</html>
